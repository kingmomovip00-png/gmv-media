<!doctype html>
<html lang="ar" dir="rtl" data-base="../" data-page="contact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خدمة العملاء — GMV Media</title>
<meta name="description" content="تواصل مع GMV Media وسيتم الرد عليك في أسرع وقت.">
<meta name="theme-color" content="#050b08">
<meta property="og:title" content="خدمة العملاء — GMV Media"><meta property="og:description" content="تواصل مع GMV Media وسيتم الرد عليك في أسرع وقت."><meta property="og:type" content="website"><meta property="og:locale" content="ar_AR">
<link rel="icon" href="../assets/img/icon-192.png"><link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"><style>.reveal,.hero__title .w{opacity:1!important;transform:none!important}</style></noscript>
<link rel="preload" href="../assets/gmvfont.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="modulepreload" href="../assets/js/site.js">
</head>
<body>
<main id="main" class="wrap">
  <div class="phead"><p class="eyebrow">تواصل</p><h1 data-split>خدمة العملاء</h1><p>تواصل معنا وسيتم الرد عليك في أسرع وقت.</p></div>
  <form class="panel reveal" id="contactForm" novalidate>
    <h2>أرسل مشكلتك الآن</h2>
    <div class="row2">
      <div class="field"><label for="name">اسمك</label><input class="input" id="name" maxlength="60" autocomplete="name" placeholder="اكتب اسمك" required></div>
      <div class="field"><label for="phone">رقم الواتساب</label><input class="input" id="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" dir="ltr" style="text-align:right" placeholder="01xxxxxxxxx" required></div>
    </div>
    <div class="field"><label for="message">رسالتك</label><textarea class="input" id="message" maxlength="1000" placeholder="اكتب رسالتك / مشكلتك..." required></textarea></div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn btn--primary btn--block" id="sendBtn" type="submit">إرسال</button>
    <a class="btn btn--block" style="margin-top:10px" href="../faq/">الأسئلة الشائعة</a>
  </form>
  <div class="socials reveal" id="socials" style="margin-top:34px"></div>
</main>
<script type="module" src="../assets/js/contact.js"></script>
</body>
</html>
