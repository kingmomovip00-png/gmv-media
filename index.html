<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GMV Media — الرئيسية</title>
  <meta name="description" content="GMV Media - شركه دعايه وتسويق" />
  <style>
    @font-face { font-family: 'GMVFont'; src: url('gmvfont.ttf') format('truetype'); font-display: swap; }
    :root{ --green:#00a33b; --black:#111; --muted:#6d6d6d; --bg-opacity:0.04; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'GMVFont',Arial,sans-serif;background:linear-gradient(135deg,#ffffff 0%,#9ce5b6 100%);color:var(--black);overflow-x:hidden;min-height:100vh;position:relative;}
    body::before{content:'';position:fixed;inset:0;background-image:url('logo.png');background-repeat:no-repeat;background-position:center;background-size:500px;opacity:var(--bg-opacity);z-index:1;pointer-events:none;filter:grayscale(1);animation:moveLogo 18s linear infinite;}
    @keyframes moveLogo{0%{transform:translateY(0)}50%{transform:translateY(6px)}100%{transform:translateY(0)}}
    .wrap{max-width:1200px;margin:0 auto;padding:28px;position:relative;z-index:2}
    .menuBtn{position:fixed;right:18px;top:18px;background:#fff;border-radius:10px;padding:10px;border:1px solid #eee;cursor:pointer;z-index:2000}
    .sidebar{position:fixed;right:-100%;top:0;width:340px;height:100%;background:rgba(0,0,0,.9);color:#fff;transition:.4s;z-index:1900;padding:30px;backdrop-filter:blur(6px)}
    .sidebar.open{right:0}
    .navItem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;transition:.2s}
    .navItem:hover{background:rgba(255,255,255,.1)}
    .navItem img{width:28px;filter:invert(1)}
    .navItem span{font-weight:bold}
    header{text-align:center;padding-top:50px}
    .logoFrame{width:140px;height:140px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .logoFrame img{width:75%}
    h1{margin-top:16px;font-size:28px;color:var(--green)}
    h2{color:var(--muted);font-size:15px;margin-bottom:10px}
    .socials{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .socials a{background:#fff;padding:10px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.05);transition:transform .3s, box-shadow .3s}
    .socials a:hover{transform:scale(1.15);box-shadow:0 4px 10px rgba(0,0,0,.2)}
    .socials img{width:24px;height:24px}
    .scrollerContainer{overflow-x:auto;scrollbar-width:none;border-radius:10px}
.scrollerContainer::-webkit-scrollbar{display:none}
.scroller{display:flex;gap:10px;align-items:center}
.scroller img{width:250px;height:160px;object-fit:cover;border-radius:10px;box-shadow:0 6px 12px rgba(0,0,0,.05);cursor:pointer}
    .offersWrap{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
    .offerCard{flex:1;max-width:48%;height:200px;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.1);background:#fff;cursor:pointer}
    .offerCard img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;opacity:0;transition:opacity 1s ease-in-out;}
    .offerCard img.active{opacity:1;}
    .offerOverlay{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.4);color:#fff;padding:6px 10px;border-radius:6px;font-weight:bold;z-index:2}
    .section{margin-top:24px}
    .titleRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .titleRow h3{color:var(--green);font-size:20px;margin:0}
    footer{text-align:center;margin-top:24px;color:var(--muted)}
    .visit{display:inline-flex;align-items:center;gap:8px;background:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.05)}
    .visit img{width:18px;height:18px}
    .floatBtn{position:fixed;left:18px;bottom:18px;background:var(--green);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2100;box-shadow:0 6px 20px rgba(0,0,0,.2)}
    .floatBtn img{width:28px}
    .dialog,.modal{display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:3000;background:rgba(0,0,0,0.7)}
    .dialog img{max-width:90%;max-height:90%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
    .modalBox{background:#fff;padding:20px;border-radius:12px;max-width:420px;width:92%;text-align:center}
    .modalBox h3{margin:0 0 15px;color:var(--green)}
    .modalBox button{background:var(--green);color:#fff;border:none;padding:8px 12px;border-radius:8px;margin:4px;cursor:pointer}
    .feedbackCard{ background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:14px 16px;margin-bottom:14px;text-align:right; }
    .feedbackCard .fb-name{font-weight:700;color:var(--green);font-size:16px;margin-bottom:6px}
    .feedbackCard .fb-time{font-size:12px;color:#777;margin-bottom:8px}
    .feedbackCard .fb-msg{font-size:14px;line-height:1.6;color:#333;white-space:pre-wrap}
    #feedbackForm input,#feedbackForm textarea{width:100%;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
    #feedbackForm button{background:var(--green);color:#fff;border:none;padding:10px 12px;border-radius:8px;cursor:pointer;width:100%}
    #openFeedback{display:block;margin:12px auto 0 auto;background:var(--green);color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;}
    .status{font-size:13px;color:var(--muted)}
    /* toast */
    #gmvToast {position:fixed;top:16px;right:16px;background:#111;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:4000;display:none;opacity:0;transform:translateY(-8px);transition:all .28s ease}
    #gmvToast.show{display:block;opacity:1;transform:translateY(0)}
    @media (max-width:900px){ .scroller img{width:180px;height:140px} .offerCard{height:140px} }

  .wrap {
    padding: 10px;
    width: 100%;
  }

  h1 {
    font-size: 24px;
  }

  h2, h3 {
    font-size: 18px;
  }

  .socials a {
    font-size: 16px;
    padding: 8px;
  }

  .masonry-item {
    width: 100%;
  }
}
.masonry-item img {
  width: 100%;
  height: auto;
  max-width: 100%;
}

.socials a,.offerCard,.feedbackCard,.visit{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.76);backdrop-filter:blur(12px);box-shadow:0 12px 32px rgba(0,75,28,.07);transition:transform .25s,box-shadow .25s}.socials a:hover,.offerCard:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(0,75,28,.14)}
.section{padding:18px;border:1px solid rgba(255,255,255,.85);border-radius:22px;background:rgba(255,255,255,.48);backdrop-filter:blur(10px);box-shadow:0 16px 45px rgba(0,75,28,.055);margin-top:28px}.titleRow h3{font-size:22px}.scrollerContainer{padding:6px 0;cursor:grab;touch-action:pan-y}.scrollerContainer:active{cursor:grabbing}.scroller{width:max-content;will-change:transform;gap:14px}.scroller img,.scroller video{width:250px;height:170px;object-fit:cover;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.09);transition:transform .25s}.scroller img:hover{transform:translateY(-4px) scale(1.012)}.marquee-controls button{border:1px solid var(--line);background:rgba(255,255,255,.88);border-radius:10px;padding:7px 12px;color:var(--green);font:inherit;cursor:pointer}.section{animation:gmvReveal .55s both}@keyframes gmvReveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.wrap{padding:12px}.section{padding:13px;border-radius:18px}.scroller img,.scroller video{width:205px;height:145px}.logoFrame{width:122px;height:122px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  <script type="module">
    /***********************************************

     *   - Exposing the BOT TOKEN in client-side is insecure.

     ***********************************************/

    // ------ Firebase config (keep as provided) ------
    const firebaseConfig = {
      apiKey: "AIzaSyAq8CVFxYPWAa9HBvSSz6NrEcek_UVf2QM",
      authDomain: "gmv-media.firebaseapp.com",
      databaseURL: "https://gmv-media-default-rtdb.firebaseio.com",
      projectId: "gmv-media",
      storageBucket: "gmv-media.firebasestorage.app",
      messagingSenderId: "316734655967",
      appId: "1:316734655967:web:3ca0582c8b6c9db835086a"
    };

    // ------ Telegram (you gave these) ------
    // ⚠️ These values will be visible in the page source if you deploy this file.
    const TELEGRAM_BOT_TOKEN = "8438555430:AAGH0A1d-CjJzYp8dDBVZvO4OV0x2NFjIhM";
    const TELEGRAM_CHAT_ID  = "7056197961";

    // (Optional) If you still want Apps Script calls for anything, put URL here; otherwise leave null.
    const SHEET_WEBAPP_URL = null;

    // Firebase modular imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Helpers
    function getCookie(name){
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if(parts.length===2) return parts.pop().split(';').shift();
    }
    function setCookie(name,value,days){
      const d = new Date();
      d.setTime(d.getTime()+(days*24*60*60*1000));
      document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
    }
    function generateUUID(){
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
        const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8);
        return v.toString(16);
      });
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function showToast(text, ms = 2200){
      const t = document.getElementById('gmvToast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(t._hideTimer);
      t._hideTimer = setTimeout(()=> t.classList.remove('show'), ms);
    }

    // State
    let userId = getCookie('gmv_uid');
    let isNewUser = false;
    if(!userId){
      userId = generateUUID();
      setCookie('gmv_uid', userId, 365);
      isNewUser = true;
    }

    // local fallback
    let localUsers = JSON.parse(localStorage.getItem('gmv_users')||'[]');
    if(!localUsers.includes(userId)){
      localUsers.push(userId);
      localStorage.setItem('gmv_users', JSON.stringify(localUsers));
    }
    document.getElementById('visitCount').textContent = localUsers.length;

    // Country detection (try ipwho.is then fallback)
    (async function detectCountry(){
      try {
        const r = await fetch('https://ipwho.is/');
        if(r.ok){
          const j = await r.json();
          if(j && j.country) {
            localStorage.setItem('gmv_country', j.country);
            return;
          }
        }
      } catch(e){}
      localStorage.setItem('gmv_country', 'غير معروف');
    })();

    // Firebase helpers
    function writeUserToDB(uid, data) {
      return set(ref(db, `users/${uid}`), data);
    }
    function pushFeedbackToDB(data) {
      return push(ref(db, `feedbacks`), data);
    }
    async function fetchAllFeedbacksOnce(){
      const snap = await get(ref(db, 'feedbacks'));
      if(!snap.exists()) return [];
      const obj = snap.val();
      return Object.keys(obj).map(k => ({ id: k, ...obj[k] }));
    }

    // Render helpers
    const feedbackList = document.getElementById('feedbackList');
    function renderFeedbacks(arr){
      if(!Array.isArray(arr)) arr = [];
      if(arr.length === 0){
        feedbackList.innerHTML = `<p style="text-align:center;color:var(--muted);margin-top:10px;">لا توجد آراء حتى الآن.</p>`;
        return;
      }
      const sorted = arr.slice().reverse();
      feedbackList.innerHTML = sorted.map(f=>{
        const name = escapeHtml(f.name || 'زائر');
        const time = escapeHtml(f.time || '');
        const msg = escapeHtml(f.msg || '');
        return `
          <div class="feedbackCard" role="article">
            <div class="fb-name">${name}</div>
            <div class="fb-time">${time}</div>
            <div class="fb-msg">${msg}</div>
          </div>
        `;
      }).join('');
    }
    function appendFeedbackItem(f){
      const div = document.createElement('div');
      div.className = 'feedbackCard';
      div.setAttribute('role','article');
      div.innerHTML = `<div class="fb-name">${escapeHtml(f.name||'زائر')}</div><div class="fb-time">${escapeHtml(f.time||'')}</div><div class="fb-msg">${escapeHtml(f.msg||'')}</div>`;
      feedbackList.insertBefore(div, feedbackList.firstChild);
    }

    // Realtime new feedbacks (avoid duplicates)
    let initialFeedbacksLoaded = false;
    onChildAdded(ref(db, 'feedbacks'), (snap) => {
      const val = snap.val();

    // --- Send Telegram (client-side) ---
    async function sendTelegramNotification(text) {
      // ⚠️ Warning: sending from client exposes the token in network requests & source code.
      // If Telegram blocks CORS or you want secure setup, use a server (Apps Script or Cloud Function).
      try {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        const body = { chat_id: TELEGRAM_CHAT_ID, text, parse_mode: "HTML" };
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        // optional: check res.ok
        return res.ok;
      } catch (e) {
        console.warn('Telegram send failed', e);
        return false;
      }
    }

    // Register user: check existence -> write -> notify (only if new)
    async function registerUserToServer(){
      // wait briefly for user to pick type (if they do)
      let userType = localStorage.getItem('gmv_usertype') || localStorage.getItem('gmv_userType');
      if(!userType){
        for(let i=0;i<20;i++){ await new Promise(r=>setTimeout(r,250)); userType = localStorage.getItem('gmv_usertype') || localStorage.getItem('gmv_userType'); if(userType) break; }
      }

      const payload = {
        userId,
        country: localStorage.getItem('gmv_country') || 'غير معروف',
        type: userType || 'غير محدد',
        time: new Date().toLocaleString(),
        site: window.location.href
      };

      // check existing
      try {
        const snapshot = await get(ref(db, `users/${userId}`));
        const exists = snapshot.exists();
        if(!exists){
          // write
          await writeUserToDB(userId, payload);
          // count total users
          const allSnap = await get(ref(db, 'users'));
          const total = allSnap.exists() ? Object.keys(allSnap.val()).length : 1;
          // prepare message
          const msg = `👤 مستخدم جديد دخل الموقع!\n\n🌍 الدولة: ${payload.country}\n🏷️ الفئة: ${payload.type}\n🕒 ${payload.time}\n👥 إجمالي المستخدمين الآن: ${total}`;
          // send telegram (best-effort)
          const ok = await sendTelegramNotification(msg);
          if(!ok) console.warn('Telegram may have blocked request (CORS) or token issue.');
        } else {
          // already existed — update info quietly (no telegram)
          await writeUserToDB(userId, payload);
        }
      } catch(e){
        console.error('registerUserToServer failed', e);
      }

      // optional: notify Apps Script if you still want server-side copy (SHEET_WEBAPP_URL)
      if(SHEET_WEBAPP_URL){
        try {
          await fetch(`${SHEET_WEBAPP_URL}?action=addUser`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
        } catch(e){ console.warn('notify apps script failed', e); }
      }
    }

    function waitForCountryOrType(timeoutMs = 5000){
      return new Promise(resolve=>{
        const start = Date.now();
        const tick = ()=>{
          const country = localStorage.getItem('gmv_country');
          const type = localStorage.getItem('gmv_usertype') || localStorage.getItem('gmv_userType');
          if(country || type || (Date.now()-start) > timeoutMs) resolve({country,type});
          else setTimeout(tick,250);
        };
        tick();
      });
    }

      waitForCountryOrType(5000).then(()=>{ registerUserToServer().catch(()=>{}); }).catch(()=>{ registerUserToServer().catch(()=>{}); });

<script>
(()=>{
 const track=document.getElementById('worksScroller');
 const view=track?.parentElement;
 const toggle=document.getElementById('marqueeToggle');
 if(!track||!view||!toggle)return;
 let running=true,offset=0,last=0,speed=34,direction=1,dragging=false,startX=0,startOffset=0,raf=0,half=0;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function measure(){half=track.scrollWidth/2;if(!half)half=track.scrollWidth;}
 function draw(){track.style.transform=`translate3d(${offset}px,0,0)`;}
 function stopFrame(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
 function frame(t){if(!running||dragging||document.hidden){stopFrame();return;}if(!last)last=t;const dt=Math.min(40,t-last);last=t;measure();if(half>view.clientWidth){offset-=direction*speed*dt/1000;if(offset<=-half)offset=0;if(offset>0)offset=-half;draw();}raf=requestAnimationFrame(frame);}
 function start(){if(!running||reduced||raf)return;raf=requestAnimationFrame(frame);}
 function setRunning(v){running=v;toggle.textContent=running?'إيقاف الحركة':'تشغيل الحركة';toggle.setAttribute('aria-pressed',String(!running));if(running)start();else stopFrame();}
 async function load(){
   try{
    const [sr,mr]=await Promise.all([fetch('/api/public/settings',{cache:'no-store'}),fetch('/api/public/media?type=work',{cache:'no-store'})]);
    if(sr.ok){const s=await sr.json();speed=Math.max(8,Math.min(100,Number(s.speed)||34));direction=s.direction==='ltr'?-1:1;if(s.mode==='static')setRunning(false);}
    if(mr.ok){const d=await mr.json();if(Array.isArray(d.items)&&d.items.length){track.innerHTML=d.items.map(x=>x.type==='video'?`<video src="${String(x.url).replace(/"/g,'&quot;')}" muted loop playsinline autoplay preload="metadata"></video>`:`<img src="${String(x.url).replace(/"/g,'&quot;')}" alt="${String(x.title||'عمل GMV').replace(/[&<>\"]/g,'')}" loading="lazy" decoding="async">`).join('');}}
   }catch(e){console.warn('GMV gallery fallback active',e);}
   const originals=[...track.children];if(originals.length){originals.forEach(n=>track.append(n.cloneNode(true)));}
   measure();draw();if(running)start();
 }
 toggle.addEventListener('click',()=>setRunning(!running));
 view.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;startX=e.clientX;startOffset=offset;stopFrame();view.setPointerCapture?.(e.pointerId);});
 view.addEventListener('pointermove',e=>{if(!dragging)return;offset=startOffset+e.clientX-startX;if(half){if(offset < -half)offset+=half;if(offset>0)offset-=half;}draw();});
 const endDrag=()=>{if(!dragging)return;dragging=false;if(running)start();};
 view.addEventListener('pointerup',endDrag);view.addEventListener('pointercancel',endDrag);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stopFrame();else if(running)start();});
 window.addEventListener('resize',()=>{measure();});
 load();
})();
</script>
