<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>أعمالنا — GMV Media</title>

<style>
@font-face {
  font-family: 'GMVFont';
  src: url('../GMVFont.ttf') format('truetype');
  font-display: swap;
}

:root{
  --green:#00a33b;
  --muted:#666;
  --black:#111;
  --bg-opacity:0.05;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'GMVFont',Arial;
  background:linear-gradient(135deg,#ffffff 0%,#9ce5b6 100%);
  color:var(--black);
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url('../logo.png');
  background-repeat:no-repeat;
  background-position:center;
  background-size:450px;
  opacity:var(--bg-opacity);
  z-index:1;
  pointer-events:none;
  filter:grayscale(1);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px;
  position:relative;
  z-index:3;
}

/* MENU BUTTON */
.menuBtn{
  position:fixed;
  right:18px;
  top:18px;
  background:#fff;
  border-radius:10px;
  padding:10px;
  border:1px solid #eee;
  cursor:pointer;
  z-index:2000;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  right:-100%;
  top:0;
  width:330px;
  height:100%;
  background:rgba(0,0,0,.9);
  color:#fff;
  transition:.4s;
  z-index:1900;
  padding:30px;
  backdrop-filter:blur(6px);
}
.sidebar.open{ right:0; }

.navItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}
.navItem:hover{ background:rgba(255,255,255,.1); }
.navItem img{ width:28px; filter:invert(1); }

/* FILTER */
.filter{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:20px 0 30px 0;
}

.filter button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  background:#fff;
  color:var(--black);
  cursor:pointer;
  font-weight:bold;
  border:1px solid #ddd;
  transition:.2s;
}
.filter button.active,
.filter button:hover{
  background:var(--green);
  color:#fff;
}

/* MASONRY */
.masonry{
  column-count:3;
  column-gap:14px;
}
@media(max-width:900px){ .masonry{ column-count:2; } }
@media(max-width:600px){ .masonry{ column-count:1; } }

.masonry-item{
  break-inside:avoid;
  margin-bottom:14px;
  display:block;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  background:#fff;
  cursor:pointer;
}

.masonry-item img,
.masonry-item video{
  width:100%;
  height:auto;
  display:block;
}

/* Dialog */
.dialog{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:3000;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.dialog img,
.dialog video{
  max-width:90%;
  max-height:85%;
  border-radius:14px;
  box-shadow:0 0 40px rgba(0,0,0,.8);
}
@media (max-width: 600px) {
  .wrap {
    padding: 10px;
    width: 100%;
  }

  h1 {
    font-size: 24px;
  }

  h2, h3 {
    font-size: 18px;
  }

  .socials a {
    font-size: 16px;
    padding: 8px;
  }

  .masonry-item {
    width: 100%;
  }
}
.masonry-item img,
.masonry-item video {
  width: 100%;
  height: auto;
  max-width: 100%;
}
</style>
</head>

<body>

<div class="menuBtn" id="menuBtn">☰</div>

<aside class="sidebar" id="sidebar">
  <div class="navItem" id="homeLink" data-href="../index.html"><img src="../icons/home.svg"><span>الرئيسية</span></div>
  <div class="navItem" id="servicesLink" data-href="#"><img src="../icons/services.svg"><span>خدماتنا</span></div>
  <div class="navItem" id="worksLink" data-href="../Works/index.html"><img src="../icons/works.svg"><span>أعمالنا</span></div>
  <div class="navItem" id="reviewsLink" data-href="../reviews/index.html"><img src="../icons/reviews.svg"><span>آراء العملاء</span></div>
  <div class="navItem" id="contactLink" data-href="index.html"><img src="../icons/contact.svg"><span>خدمة العملاء</span></div>
</aside>

<div class="wrap">

  <h1 style="text-align:center;color:var(--green);margin-bottom:10px;">أعمال GMV Media</h1>
  <p style="text-align:center;color:var(--muted);margin-bottom:25px;">تصفح أعمالنا: تصميمات — فيديوهات</p>

  <!-- FILTER -->
  <div class="filter" id="filterBtns">
    <button data-filter="all" class="active">الكل</button>
    <button data-filter="design">تصاميم</button>
    <button data-filter="video">فيديوهات</button>
  </div>

  <!-- GRID -->
  <div class="masonry" id="masonryGrid"></div>

</div>

<!-- DIALOG -->
<div class="dialog" id="dialog">
  <img id="dialogImg" style="display:none;">
  <video id="dialogVideo" controls style="display:none;"></video>
</div>

<script>
// MENU
document.getElementById('menuBtn').onclick = () =>{
  document.getElementById('sidebar').classList.toggle('open');
};
document.querySelectorAll('.navItem').forEach(i=>{
  i.onclick = ()=> location.href = i.dataset.href;
});

/* ===========================
     LOAD + RANDOMIZE ITEMS
=========================== */

let items = [];

// images
for(let i=1;i<=24;i++){
  items.push({type:"design", src:`design/${i}.webp`});
}
// videos
for(let i=1;i<=3;i++){
  items.push({type:"video", src:`videos/${i}.webm`});
}

// random shuffle
items.sort(()=> Math.random() - 0.5);

const masonry = document.getElementById("masonryGrid");

items.forEach(it=>{
  const div = document.createElement("div");
  div.className = `masonry-item ${it.type}`;

  if(it.type==="design"){
    div.innerHTML = `<img loading="lazy" src="${it.src}">`;
  } else {
    div.innerHTML = `<video muted loop playsinline preload="none"><source src="${it.src}" type="video/webm"></video>`;
  }

  masonry.appendChild(div);
});

// Load and play gallery videos only when they are near the viewport.
const galleryVideos = document.querySelectorAll("#masonryGrid video");
if ("IntersectionObserver" in window) {
  const videoObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) video.play().catch(()=>{});
      else video.pause();
    });
  }, { rootMargin: "180px" });
  galleryVideos.forEach(video => videoObserver.observe(video));
}

/* FILTER */
const btns = document.querySelectorAll(".filter button");

btns.forEach(btn=>{
  btn.onclick = ()=>{
    btns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    const f = btn.dataset.filter;

    document.querySelectorAll(".masonry-item").forEach(el=>{
      if(f==="all") el.style.display="block";
      else el.style.display = el.classList.contains(f) ? "block" : "none";
    });
  };
});

/* DIALOG ZOOM */
const dialog = document.getElementById("dialog");
const dialogImg = document.getElementById("dialogImg");
const dialogVideo = document.getElementById("dialogVideo");

// عند الضغط على صورة أو فيديو فقط
document.addEventListener("click", e => {
  const img = e.target.closest(".masonry-item img");
  const vid = e.target.closest(".masonry-item video");

  // لو مش صورة ولا فيديو → ميفتحش الديالوج
  if (!img && !vid) return;

  dialog.style.display = "flex";

  if (img) {
    dialogImg.src = img.src;
    dialogImg.style.display = "block";
    dialogVideo.style.display = "none";
    dialogVideo.pause();
  }

  else if (vid) {
    dialogVideo.src = vid.querySelector("source").src;
    dialogVideo.style.display = "block";
    dialogImg.style.display = "none";
    dialogVideo.play();
  }
});

// اغلاق عند الضغط على الخلفية فقط
dialog.addEventListener("click", (e) => {
  if (e.target === dialog) {
    dialog.style.display = "none";
    dialogVideo.pause();
  }
});
document.getElementById("servicesLink").addEventListener("click", (e) => {
  e.preventDefault();

  const type = (localStorage.getItem("gmv_usertype") || "").toLowerCase();

  let target = "../server-small/index.html";  // افتراضي

  if (type.includes("براند"))       target = "../server-brand/index.html";
  else if (type.includes("خارج") || type.includes("بره"))  
                                   target = "../server-outside/index.html";

  window.location.href = target;
});

document.getElementById("contactLink").addEventListener("click", () => {
  window.location.href = "../contact/index.html";
});
document.getElementById("reviewsLink").addEventListener("click", () => {
  window.location.href = "../reviews/index.html";
});
document.getElementById("worksLink").addEventListener("click", () => {
  window.location.href = "../Works/index.html";
});
</script>

</body>
</html>
