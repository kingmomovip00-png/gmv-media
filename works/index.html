<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>أعمالنا — GMV Media</title>

<style>
@font-face {
  font-family: 'GMVFont';
  src: url('../gmvfont.ttf') format('truetype');
  font-display: swap;
}

:root{
  --green:#00a33b;
  --muted:#666;
  --black:#111;
  --bg-opacity:0.05;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'GMVFont',Arial;
  background:linear-gradient(135deg,#ffffff 0%,#9ce5b6 100%);
  color:var(--black);
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url('../logo.png');
  background-repeat:no-repeat;
  background-position:center;
  background-size:450px;
  opacity:var(--bg-opacity);
  z-index:1;
  pointer-events:none;
  filter:grayscale(1);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px;
  position:relative;
  z-index:3;
}

/* MENU BUTTON */
.menuBtn{
  position:fixed;
  right:18px;
  top:18px;
  background:#fff;
  border-radius:10px;
  padding:10px;
  border:1px solid #eee;
  cursor:pointer;
  z-index:2000;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  right:-100%;
  top:0;
  width:330px;
  height:100%;
  background:rgba(0,0,0,.9);
  color:#fff;
  transition:.4s;
  z-index:1900;
  padding:30px;
  backdrop-filter:blur(6px);
}
.sidebar.open{ right:0; }

.navItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}
.navItem:hover{ background:rgba(255,255,255,.1); }
.navItem img{ width:28px; filter:invert(1); }

/* FILTER */
.filter{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:20px 0 30px 0;
}

.filter button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  background:#fff;
  color:var(--black);
  cursor:pointer;
  font-weight:bold;
  border:1px solid #ddd;
  transition:.2s;
}
.filter button.active,
.filter button:hover{
  background:var(--green);
  color:#fff;
}

/* MASONRY */
.masonry{
  column-count:3;
  column-gap:14px;
}
@media(max-width:900px){ .masonry{ column-count:2; } }
@media(max-width:600px){ .masonry{ column-count:1; } }

.masonry-item{
  break-inside:avoid;
  margin-bottom:14px;
  display:block;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  background:#fff;
  cursor:pointer;
}

.masonry-item img,
.masonry-item video{
  width:100%;
  height:auto;
  display:block;
}

/* Dialog */
.dialog{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:3000;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.dialog img,
.dialog video{
  max-width:90%;
  max-height:85%;
  border-radius:14px;
  box-shadow:0 0 40px rgba(0,0,0,.8);
}
@media (max-width: 600px) {
  .wrap {
    padding: 10px;
    width: 100%;
  }

  h1 {
    font-size: 24px;
  }

  h2, h3 {
    font-size: 18px;
  }

  .socials a {
    font-size: 16px;
    padding: 8px;
  }

  .masonry-item {
    width: 100%;
  }
}
.masonry-item img,
.masonry-item video {
  width: 100%;
  height: auto;
  max-width: 100%;
}
</style>
<style id="gmv-premium-layer">body{background:radial-gradient(ellipse at 12% 8%,rgba(0,163,59,.16),transparent 34%),radial-gradient(ellipse at 88% 42%,rgba(0,163,59,.12),transparent 38%),linear-gradient(135deg,#f8fcf9,#e8f7ed 55%,#f7fbf8)!important;background-attachment:fixed!important}body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;background-image:radial-gradient(rgba(0,110,43,.12) .7px,transparent .7px);background-size:22px 22px}.menuBtn{border-radius:15px!important;background:rgba(255,255,255,.82)!important;backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,70,25,.12);transition:.25s}.menuBtn:hover{transform:translateY(-3px)}.sidebar{background:linear-gradient(155deg,rgba(10,24,16,.97),rgba(5,44,23,.94))!important;backdrop-filter:blur(24px)!important;box-shadow:-25px 0 70px rgba(0,0,0,.2)}.navItem{border-radius:14px!important;transition:all .25s!important}.navItem:hover{background:rgba(0,163,59,.2)!important;transform:translateX(-4px)}button,.filter button{transition:transform .22s,box-shadow .22s,background .22s}button:hover,.filter button:hover{transform:translateY(-2px)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style>
</head>

<body>

<div class="menuBtn" id="menuBtn">☰</div>

<aside class="sidebar" id="sidebar">
  <div class="navItem" id="homeLink" data-href="../index.html"><img src="../icons/home.svg"><span>الرئيسية</span></div>
  <div class="navItem" id="servicesLink" data-href="#"><img src="../icons/services.svg"><span>خدماتنا</span></div>
  <div class="navItem" id="worksLink" data-href="../works/index.html"><img src="../icons/works.svg"><span>أعمالنا</span></div>
  <div class="navItem" id="reviewsLink" data-href="../reviews/index.html"><img src="../icons/reviews.svg"><span>آراء العملاء</span></div>
  <div class="navItem" id="contactLink" data-href="index.html"><img src="../icons/contact.svg"><span>خدمة العملاء</span></div>
</aside>

<div class="wrap">

  <h1 style="text-align:center;color:var(--green);margin-bottom:10px;">أعمال GMV Media</h1>
  <p style="text-align:center;color:var(--muted);margin-bottom:25px;">تصفح أعمالنا: تصميمات — فيديوهات</p>

  <!-- FILTER -->
  <div class="filter" id="filterBtns">
    <button data-filter="all" class="active">الكل</button>
    <button data-filter="design">تصاميم</button>
    <button data-filter="video">فيديوهات</button>
  </div>

  <!-- GRID -->
  <div class="masonry" id="masonryGrid"></div>

</div>

<!-- DIALOG -->
<div class="dialog" id="dialog">
  <img id="dialogImg" style="display:none;">
  <video id="dialogVideo" controls style="display:none;"></video>
</div>

<script>
// MENU
document.getElementById('menuBtn').onclick = () =>{
  document.getElementById('sidebar').classList.toggle('open');
};
document.querySelectorAll('.navItem').forEach(i=>{
  i.onclick = ()=> location.href = i.dataset.href;
});

/* ===========================
     LOAD + RANDOMIZE ITEMS
=========================== */

let items = [];
const masonry = document.getElementById("masonryGrid");
async function loadPortfolio(){
  try {
    const response = await fetch("../api/public/media?type=work");
    if (!response.ok) throw new Error("API unavailable");
    const data = await response.json();
    items = (data.items || []).map(x => ({type:x.type === "video" ? "video" : "design", src:x.url, title:x.title || "GMV Media"}));
  } catch (error) { items = []; }
  masonry.innerHTML = "";
  if (!items.length) {
    masonry.innerHTML = '<p style="text-align:center;color:#66816f;padding:38px 12px;">قريبًا — سيتم عرض أعمالنا الجديدة هنا.</p>';
    return;
  }
  items.forEach(it=>{
    const div=document.createElement("div");div.className=`masonry-item ${it.type}`;
    if(it.type==="design"){const img=document.createElement("img");img.loading="lazy";img.src=it.src;img.alt=it.title;div.appendChild(img);}
    else{const video=document.createElement("video");video.muted=true;video.autoplay=true;video.loop=true;video.playsInline=true;video.preload="metadata";video.src=it.src;div.appendChild(video);}
    masonry.appendChild(div);
  });
}
loadPortfolio();

/* FILTER */
const btns = document.querySelectorAll(".filter button");

btns.forEach(btn=>{
  btn.onclick = ()=>{
    btns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    const f = btn.dataset.filter;

    document.querySelectorAll(".masonry-item").forEach(el=>{
      if(f==="all") el.style.display="block";
      else el.style.display = el.classList.contains(f) ? "block" : "none";
    });
  };
});

/* DIALOG ZOOM */
const dialog = document.getElementById("dialog");
const dialogImg = document.getElementById("dialogImg");
const dialogVideo = document.getElementById("dialogVideo");

// عند الضغط على صورة أو فيديو فقط
document.addEventListener("click", e => {
  const img = e.target.closest(".masonry-item img");
  const vid = e.target.closest(".masonry-item video");

  // لو مش صورة ولا فيديو → ميفتحش الديالوج
  if (!img && !vid) return;

  dialog.style.display = "flex";

  if (img) {
    dialogImg.src = img.src;
    dialogImg.style.display = "block";
    dialogVideo.style.display = "none";
    dialogVideo.pause();
  }

  else if (vid) {
    dialogVideo.src = vid.querySelector("source").src;
    dialogVideo.style.display = "block";
    dialogImg.style.display = "none";
    dialogVideo.play();
  }
});

// اغلاق عند الضغط على الخلفية فقط
dialog.addEventListener("click", (e) => {
  if (e.target === dialog) {
    dialog.style.display = "none";
    dialogVideo.pause();
  }
});
document.getElementById("servicesLink").addEventListener("click", (e) => {
  e.preventDefault();

  const type = (localStorage.getItem("gmv_usertype") || "").toLowerCase();

  let target = "../server-small/index.html";  // افتراضي

  if (type.includes("براند"))       target = "../server-brand/index.html";
  else if (type.includes("خارج") || type.includes("بره"))  
                                   target = "../server-outside/index.html";

  window.location.href = target;
});

document.getElementById("contactLink").addEventListener("click", () => {
  window.location.href = "../contact/index.html";
});
document.getElementById("reviewsLink").addEventListener("click", () => {
  window.location.href = "../reviews/index.html";
});
document.getElementById("worksLink").addEventListener("click", () => {
  window.location.href = "../works/index.html";
});
</script>

</body>
</html>
