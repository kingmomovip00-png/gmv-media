<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>خدمات المحلات الصغيرة — GMV Media</title>
  <meta name="description" content="باقات وخدمات GMV Media للمحلات الصغيرة" />
  <style>
    @font-face { font-family: 'GMVFont'; src: url('../gmvfont.ttf') format('truetype'); font-display: swap; }
    :root{ --green:#00a33b; --black:#111; --muted:#6d6d6d; --bg-opacity:0.05; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'GMVFont',Arial,sans-serif;background:linear-gradient(135deg,#ffffff 0%,#9ce5b6 100%);color:var(--black);overflow-x:hidden;min-height:100vh;position:relative;}
    body::before{content:'';position:fixed;inset:0;background-image:url('../logo.png');background-repeat:no-repeat;background-position:center;background-size:450px;opacity:var(--bg-opacity);z-index:1;pointer-events:none;filter:grayscale(1);}
    .wrap{max-width:1200px;margin:0 auto;padding:28px;position:relative;z-index:2}
    header{text-align:center;margin-bottom:30px}
    h1{font-size:26px;color:var(--green);margin:20px 0;}
    .menuBtn{position:fixed;right:18px;top:18px;background:#fff;border-radius:10px;padding:10px;border:1px solid #eee;cursor:pointer;z-index:2000}
    .sidebar{position:fixed;right:-100%;top:0;width:340px;height:100%;background:rgba(0,0,0,.9);color:#fff;transition:.4s;z-index:1900;padding:30px;backdrop-filter:blur(6px)}
    .sidebar.open{right:0}
    .navItem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;transition:.2s}
    .navItem:hover{background:rgba(255,255,255,.1)}
    .navItem img{width:28px;filter:invert(1)}
    .navItem span{font-weight:bold}

    .grid{display:grid;grid-template-columns: repeat(2, 1fr); /* عمودين ثابت */gap: 16px;}
    .card{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);cursor:pointer;background:#fff;}
    .card img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
    .card:hover img{transform:scale(1.05);}

    .dialog{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:3000;align-items:center;justify-content:center;flex-direction:column;}
    .dialog img{max-width:90%;max-height:70%;border-radius:14px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.6);}
    .dialog button{background:var(--green);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-size:16px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);}
    .dialog button:hover{transform:scale(1.05);}
    .backBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  background: var(--green);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  z-index: 2000;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
}
.backBtn:hover {
  background: #008f34;
}
@media (max-width: 600px) {
  .wrap {
    padding: 10px;
    width: 100%;
  }

  h1 {
    font-size: 24px;
  }

  h2, h3 {
    font-size: 18px;
  }

  .socials a {
    font-size: 16px;
    padding: 8px;
  }

  .masonry-item {
    width: 100%;
  }
}
.masonry-item img {
  width: 100%;
  height: auto;
  max-width: 100%;
}
  </style>
<style id="gmv-premium-layer">body{background:radial-gradient(ellipse at 12% 8%,rgba(0,163,59,.16),transparent 34%),radial-gradient(ellipse at 88% 42%,rgba(0,163,59,.12),transparent 38%),linear-gradient(135deg,#f8fcf9,#e8f7ed 55%,#f7fbf8)!important;background-attachment:fixed!important}body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;background-image:radial-gradient(rgba(0,110,43,.12) .7px,transparent .7px);background-size:22px 22px}.menuBtn{border-radius:15px!important;background:rgba(255,255,255,.82)!important;backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,70,25,.12);transition:.25s}.menuBtn:hover{transform:translateY(-3px)}.sidebar{background:linear-gradient(155deg,rgba(10,24,16,.97),rgba(5,44,23,.94))!important;backdrop-filter:blur(24px)!important;box-shadow:-25px 0 70px rgba(0,0,0,.2)}.navItem{border-radius:14px!important;transition:all .25s!important}.navItem:hover{background:rgba(0,163,59,.2)!important;transform:translateX(-4px)}button,.filter button{transition:transform .22s,box-shadow .22s,background .22s}button:hover,.filter button:hover{transform:translateY(-2px)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style>
</head>
<body>
<a href="../index.html" class="backBtn">← الرجوع للرئيسية</a>
  <div class="menuBtn" id="menuBtn">☰</div>
  <aside class="sidebar" id="sidebar">
  <div class="navItem" id="homeLink" data-href="../index.html"><img src="../icons/home.svg"><span>الرئيسية</span></div>
  <div class="navItem" id="servicesLink" data-href="#"><img src="../icons/services.svg"><span>خدماتنا</span></div>
  <div class="navItem" id="worksLink" data-href="../works/index.html"><img src="../icons/works.svg"><span>أعمالنا</span></div>
  <div class="navItem" id="reviewsLink" data-href="../reviews/index.html"><img src="../icons/reviews.svg"><span>آراء العملاء</span></div>
  <div class="navItem" id="contactLink" data-href="index.html"><img src="../icons/contact.svg"><span>خدمة العملاء</span></div>
</aside>

  <main class="wrap">
    <header>
      <h1>باقات العملاء خارج مصر</h1>
      <p style="color:var(--muted);font-size:14px;">اختر الباقة المناسبة لك واضغط للاستفسار مباشرة عبر واتساب</p>
    </header>

    <section class="grid" id="offersGrid">
      <div class="card"><img src="1.webp" alt="باقة 1"></div>
      <div class="card"><img src="2.webp" alt="باقة 2"></div>
      <div class="card"><img src="3.webp" alt="باقة 3"></div>
      <div class="card"><img src="4.webp" alt="باقة 4"></div>
      <div class="card"><img src="5.webp" alt="باقة 5"></div>
      <div class="card"><img src="6.webp" alt="باقة 6"></div>
    </section>
    <!-- ملاحظة في نهاية الصفحة -->
    <div style="margin-top:30px;text-align:center;background:#e9fdf0;border:1px solid #b6e3c4;padding:14px 10px;border-radius:10px;color:var(--black);font-size:15px;line-height:1.6;">
      💡 <strong>ملحوظة:</strong> يمكن للعميل تبديل أو خصم أي عنصر من عناصر الباقة حسب احتياجاته، وسيتم تعديل السعر وفقًا لذلك.
    </div>
  </main>

  <div class="dialog" id="dialog">
    <img id="dialogImg" src="" alt="">
    <button id="whatsBtn">💬 استفسر عن هذه الباقة</button>
  </div>

  <script>
    // القائمة الجانبية
    document.getElementById('menuBtn').addEventListener('click',()=> {
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.querySelectorAll('.navItem').forEach(it=>{
      it.addEventListener('click',()=> location.href = it.dataset.href);
    });

    // عرض الصور داخل نافذة
    const dialog = document.getElementById('dialog');
    const dialogImg = document.getElementById('dialogImg');
    const whatsBtn = document.getElementById('whatsBtn');
    const whatsappNumber = "201508280795";

    document.querySelectorAll('.card img').forEach(img=>{
      img.addEventListener('click', ()=>{
        dialogImg.src = img.src;
        dialog.style.display = 'flex';
      });
    });

    dialog.addEventListener('click', e=>{
      if(e.target === dialog) dialog.style.display='none';
    });

    whatsBtn.addEventListener('click', ()=>{
      const msg = encodeURIComponent("Hello, I would like to inquire about this package (Outside Egypt client).");
      window.open(`https://wa.me/${whatsappNumber}?text=${msg}`,'_blank');
    });
    document.getElementById("servicesLink").addEventListener("click", (e) => {
  e.preventDefault();

  const type = (localStorage.getItem("gmv_usertype") || "").toLowerCase();

  let target = "../server-small/index.html";  // افتراضي

  if (type.includes("براند"))       target = "../server-brand/index.html";
  else if (type.includes("خارج") || type.includes("بره"))  
                                   target = "../server-outside/index.html";

  window.location.href = target;
});
document.getElementById("contactLink").addEventListener("click", () => {
  window.location.href = "../contact/index.html";
});
document.getElementById("reviewsLink").addEventListener("click", () => {
  window.location.href = "../reviews/index.html";
});
document.getElementById("worksLink").addEventListener("click", () => {
  window.location.href = "../works/index.html";
});
  </script>
</body>
</html>
