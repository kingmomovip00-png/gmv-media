<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMV Admin</title><link rel="icon" href="../favicon.ico"><style>@font-face{font-family:GMV;src:url('../gmvfont.ttf')}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e0f5e8,#f7faf8 55%);font-family:GMV,Arial;color:#142019}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#ffffffb8;border:1px solid #d5e9dc;border-radius:22px;padding:25px;box-shadow:0 20px 60px #164b2a12;backdrop-filter:blur(14px);margin:15px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9dfd0;margin:5px}button{background:#00a33b;color:white;border:0;cursor:pointer}button:hover{filter:brightness(.92)}.row{display:flex;flex-wrap:wrap;gap:8px}input[type=email],input[type=password],input[type=text]{width:min(100%,350px)}#status{white-space:pre-wrap;color:#24683d}.item{padding:10px;background:#eef8f1;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.hint{color:#607568;font-size:14px}</style></head><body><main class="wrap"><h1>GMV Media — لوحة الإدارة</h1><p>إدارة الأعمال والتصميمات والفيديوهات والتحكم في الجريد</p><section class="card" id="login"><h2>تسجيل دخول الأدمن</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">دخول</button><p class="hint">الدخول بحساب Firebase Authentication المصرح به فقط.</p></section><section class="card" id="panel" hidden><div class="row"><button id="logout">تسجيل خروج</button></div><h2>رفع تصميم أو فيديو</h2><div class="row"><input id="file" type="file" accept="image/*,video/*"><select id="category"><option value="works">أعمالنا</option><option value="reviews">آراء العملاء</option><option value="offers">العروض</option></select><input id="title" type="text" placeholder="عنوان (اختياري)"></div><button id="upload">رفع وإضافة</button><hr><h2>إعدادات الجريد</h2><label><input id="motion" type="checkbox" checked> تفعيل الحركة التلقائية</label><label>السرعة <input id="speed" type="range" min="10" max="100" value="35"></label><button id="saveSettings">حفظ الإعدادات</button><h2>الملفات المرفوعة</h2><div id="items"></div><p id="status"></p></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';import{getDatabase,ref,push,set,onValue,remove}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js';
const config={apiKey:'AIzaSyAq8CVFxYPWAa9HBVSSz6NrEcek_UVf2QM',authDomain:'gmv-media.firebaseapp.com',databaseURL:'https://gmv-media-default-rtdb.firebaseio.com',projectId:'gmv-media',storageBucket:'gmv-media.firebasestorage.app',messagingSenderId:'316734655967',appId:'1:316734655967:web:3ca0582c8b6c9db835086a'};const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;let current=null;
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){status('فشل تسجيل الدخول: '+e.message)}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{current=u;$('login').hidden=!!u;$('panel').hidden=!u;if(u){status('تم تسجيل الدخول');load()}});
function load(){onValue(ref(db,'gmvAssets'),snap=>{const data=snap.val()||{};$('items').innerHTML='';Object.entries(data).forEach(([id,x])=>{const div=document.createElement('div');div.className='item';const label=document.createElement('span');label.textContent=(x.category||'')+' — '+(x.title||x.name||x.url);const del=document.createElement('button');del.textContent='حذف';del.onclick=async()=>{if(confirm('حذف هذا العنصر من الموقع؟'))await remove(ref(db,'gmvAssets/'+id))};div.append(label,del);$('items').append(div)})});onValue(ref(db,'gmvSettings'),s=>{const x=s.val()||{};$('motion').checked=x.motion!==false;$('speed').value=x.speed||35})}
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f||!current)return status('اختار ملف الأول');try{status('جاري تجهيز الرفع...');const token=await current.getIdToken();const authRes=await fetch('/api/imagekit-auth',{headers:{Authorization:'Bearer '+token}});if(!authRes.ok)throw Error(await authRes.text());const authData=await authRes.json();const fd=new FormData();fd.append('file',f);fd.append('fileName',f.name);fd.append('folder','/gmv-media/'+$('category').value);fd.append('publicKey',authData.publicKey);fd.append('signature',authData.signature);fd.append('expire',authData.expire);fd.append('token',authData.token);const r=await fetch('https://upload.imagekit.io/api/v1/files/upload',{method:'POST',body:fd});const uploaded=await r.json();if(!r.ok)throw Error(uploaded.message||'Upload failed');await push(ref(db,'gmvAssets'),{url:uploaded.url,fileId:uploaded.fileId,type:f.type.startsWith('video/')?'video':'image',category:$('category').value,title:$('title').value||f.name,createdAt:Date.now(),uploader:current.email});status('تم رفع الملف وإضافته للمكتبة بنجاح');$('file').value='';}catch(e){status('خطأ: '+e.message)}};
$('saveSettings').onclick=async()=>{try{await set(ref(db,'gmvSettings'),{motion:$('motion').checked,speed:Number($('speed').value)});status('تم حفظ إعدادات الجريد')}catch(e){status('فشل الحفظ: '+e.message)}};
</script></body></html>
